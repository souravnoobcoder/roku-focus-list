# openjdk17 is JitPack's newest option and satisfies AGP 9 (min JDK 17). The release workflow
# builds on JDK 17 too, so what JitPack runs here is exercised before a tag is ever cut.
jdk:
  - openjdk17
# Kotlin Multiplatform publishes several modules under the same group: roku-focus-list (root
# metadata), -android, -desktop, -iosarm64, -iossimulatorarm64, -iosx64. Consumers only ever
# reference the root coordinate; Gradle metadata redirects to the rest.
install:
  - ./gradlew :roku-focus-list:publishToMavenLocal
