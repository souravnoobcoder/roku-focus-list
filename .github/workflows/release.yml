name: Release

# Cut a new published version on demand:
#   gh workflow run release.yml -f version=2.0.1
# or from the Actions tab. Bump libraryVersion in gradle.properties first, in a normal PR —
# this workflow never pushes to master, it only creates a tag, a release, and a Central deployment.
#
# Needs four repository secrets (Settings > Secrets and variables > Actions):
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD  — a user token from central.sonatype.com
#   SIGNING_KEY                                      — ascii-armoured GPG private key
#   SIGNING_KEY_PASSWORD                             — its passphrase
# The deployment is published automatically, then verified by resolving it back off Central.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 2.0.1. Must already match libraryVersion in gradle.properties."
        required: true
        type: string
      dry_run:
        description: "Run every check but do not tag, release, or upload anything."
        type: boolean
        default: false
      prerelease:
        description: "Mark the GitHub release as a pre-release."
        type: boolean
        default: false

permissions:
  contents: write

# Two releases running at once would race on tags and on the Central deployment.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the version and the branch
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Bare numeric tags, matching the existing 1.0.0 tag. A leading v would change the
          # coordinate consumers write.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$VERSION' is not a bare semver version (expected e.g. 2.0.1, no leading v)."
            exit 1
          fi

          declared=$(grep -E '^libraryVersion=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "$declared" != "$VERSION" ]; then
            echo "::error::gradle.properties declares libraryVersion=$declared but you asked to release $VERSION."
            echo "::error::Bump libraryVersion in a PR first, then run this workflow against the merged commit."
            exit 1
          fi

          # A dry run tags nothing, so an existing tag must not stop it — otherwise the one mode
          # meant for validating a release cannot validate an already-tagged one.
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "::warning::Tag $VERSION already exists; a real run would refuse."
            else
              echo "::error::Tag $VERSION already exists. Releases are immutable; pick a new version."
              exit 1
            fi
          fi

          case "$REF_NAME" in
            master|release/*) ;;
            *)
              if [ "$DRY_RUN" != "true" ]; then
                echo "::error::Refusing to release from '$REF_NAME'. Run this from master, a release/* branch, or with dry_run."
                exit 1
              fi
              echo "::warning::Dry run from '$REF_NAME'."
              ;;
          esac

          echo "Releasing $VERSION from $REF_NAME (dry_run=$DRY_RUN)."

      # JDK 17 is the floor AGP 9 requires and what the project is developed on, so CI builds the
      # same toolchain rather than a newer one that happens to work.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build every target and run the shared tests
        run: |
          ./gradlew --no-daemon \
            :roku-focus-list:compileCommonMainKotlinMetadata \
            :roku-focus-list:compileAndroidMain \
            :roku-focus-list:compileKotlinDesktop \
            :roku-focus-list:compileKotlinIosArm64 \
            :roku-focus-list:compileKotlinIosX64 \
            :roku-focus-list:compileKotlinIosSimulatorArm64 \
            :roku-focus-list:desktopTest \
            :consumer-kmp:compileCommonMainKotlinMetadata \
            :consumer-kmp:compileAndroidMain \
            :app:assembleDebug \
            :app:assembleRelease

      - name: Publish locally and prove the coordinate is consumable
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :roku-focus-list:publishToMavenLocal
          # The standalone build resolves the real Maven coordinate from mavenLocal, in commonMain
          # and per target — the same path a consumer takes off Maven Central.
          ./gradlew --no-daemon -p verification/published-consumer \
            verifyCommonMainConsumption printRokuFocusResolution

      - name: Check the published version is the one being released
        env:
          VERSION: ${{ inputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          dir="$HOME/.m2/repository/io/github/$OWNER/roku-focus-list/$VERSION"
          for f in "roku-focus-list-$VERSION.pom" "roku-focus-list-$VERSION.module" \
                   "roku-focus-list-$VERSION-sources.jar" "roku-focus-list-$VERSION-javadoc.jar"; do
            if [ ! -f "$dir/$f" ]; then
              echo "::error::Missing $dir/$f — Central rejects a deployment without it."
              ls -R "$HOME/.m2/repository/io/github/$OWNER" || true
              exit 1
            fi
          done
          # Central validates the POM after upload, so catch an incomplete one here instead.
          for tag in name description url licenses developers scm; do
            if ! grep -q "<$tag>" "$dir/roku-focus-list-$VERSION.pom"; then
              echo "::error::POM has no <$tag>; Central would reject the deployment."
              exit 1
            fi
          done
          echo "Local publication looks complete."

      # Signing runs here, not only during the upload, so a wrong passphrase or a mangled key
      # fails on a dry run instead of halfway through a Central deployment.
      - name: Verify the signing key actually signs
        env:
          VERSION: ${{ inputs.version }}
          OWNER: ${{ github.repository_owner }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ORG_GRADLE_PROJECT_signingInMemoryKey:-}" ]; then
            echo "::error::SIGNING_KEY is not set. Central rejects unsigned artifacts."
            exit 1
          fi
          ./gradlew --no-daemon :roku-focus-list:publishToMavenLocal
          dir="$HOME/.m2/repository/io/github/$OWNER/roku-focus-list/$VERSION"
          missing=0
          for f in "roku-focus-list-$VERSION.pom" "roku-focus-list-$VERSION.module" \
                   "roku-focus-list-$VERSION-sources.jar" "roku-focus-list-$VERSION-javadoc.jar"; do
            [ -f "$dir/$f.asc" ] || { echo "::error::No signature for $f"; missing=1; }
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "Every required artifact is signed."

      # Written to a file rather than a step output: changelog entries are full of backticks, and
      # interpolating them into a shell command would run them.
      - name: Collect the changelog entry
        env:
          VERSION: ${{ inputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::warning::No '## [$VERSION]' section in CHANGELOG.md; releasing with a bare note."
            printf 'roku-focus-list %s\n' "$VERSION" > release-notes.md
          fi

          {
            printf '\n## Install\n\n'
            printf '```kotlin\n'
            printf 'implementation("io.github.%s:roku-focus-list:%s")\n' "$OWNER" "$VERSION"
            printf '```\n'
          } >> release-notes.md

          echo "--- release notes ---"
          cat release-notes.md

      # Uploaded before the tag exists, so a rejected deployment leaves no tag behind. The plugin
      # polls the deployment and fails the build if Central rejects it, so a validation error
      # surfaces here rather than sitting unnoticed in the Portal.
      - name: Publish to Maven Central
        if: ${{ !inputs.dry_run }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${ORG_GRADLE_PROJECT_mavenCentralUsername:-}" ] || missing+=(MAVEN_CENTRAL_USERNAME)
          [ -n "${ORG_GRADLE_PROJECT_mavenCentralPassword:-}" ] || missing+=(MAVEN_CENTRAL_PASSWORD)
          [ -n "${ORG_GRADLE_PROJECT_signingInMemoryKey:-}" ] || missing+=(SIGNING_KEY)
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            echo "::error::Signing is not optional on Central; refusing to publish unsigned."
            exit 1
          fi
          # publishAndReleaseToMavenCentral, not publishToMavenCentral: the build's
          # automaticRelease is false so that publishing is a decision made here, in CI, and not
          # something a local invocation can trigger by accident.
          ./gradlew --no-daemon :roku-focus-list:publishAndReleaseToMavenCentral
          echo "Published to Central."


      - name: Tag and publish the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -euo pipefail
          git config user.name "$ACTOR"
          git config user.email "$ACTOR_ID+$ACTOR@users.noreply.github.com"
          git tag -a "$VERSION" -m "roku-focus-list $VERSION"
          git push origin "refs/tags/$VERSION"

          args=(--title "$VERSION" --notes-file release-notes.md --target "$GITHUB_SHA")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$VERSION" "${args[@]}"

      # Without a human approving the deployment, nothing else confirms the release is usable.
      # A green publish is not the same as a resolvable artifact: JitPack served this library with
      # a successful build and metadata no Gradle consumer could resolve. So resolve it back.
      - name: Verify the release resolves off Maven Central
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          base="https://repo1.maven.org/maven2/io/github/$OWNER/roku-focus-list/$VERSION"

          echo "Waiting for Central to serve $VERSION..."
          served=false
          for attempt in $(seq 1 60); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
              "$base/roku-focus-list-$VERSION.module" || echo 000)
            if [ "$code" = "200" ]; then served=true; break; fi
            sleep 30
          done

          if [ "$served" != "true" ]; then
            echo "::warning::Central has not served $VERSION within 30 minutes."
            echo "::warning::Propagation can lag; check $base/ before assuming it is broken."
            exit 0
          fi

          # mavenLocal must go. This job published locally minutes ago, so leaving it in place
          # would resolve from disk and pass without telling us anything about Central.
          sed -i '/mavenLocal()/d' verification/published-consumer/settings.gradle.kts
          rm -rf "$HOME/.m2/repository/io/github/$OWNER"
          sed -i "s|^val rokuFocusList = .*|val rokuFocusList = \"io.github.$OWNER:roku-focus-list:$VERSION\"|" \
            verification/published-consumer/build.gradle.kts

          ./gradlew --no-daemon -p verification/published-consumer \
            --refresh-dependencies verifyCommonMainConsumption printRokuFocusResolution

          echo "$VERSION resolves from Central in commonMain and per target."

      - name: Summary
        if: always()
        env:
          VERSION: ${{ inputs.version }}
          OWNER: ${{ github.repository_owner }}
          DRY_RUN: ${{ inputs.dry_run }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## roku-focus-list $VERSION"
            echo
            if [ "$DRY_RUN" = "true" ]; then
              echo "Dry run — nothing was tagged, released, or uploaded."
            else
              echo "- Tag: \`$VERSION\` on \`$GITHUB_SHA\`"
              echo "- Release: https://github.com/$REPO/releases/tag/$VERSION"
              echo "- Maven Central: https://central.sonatype.com/artifact/io.github.$OWNER/roku-focus-list/$VERSION"
              echo
              echo "Published and resolved back off Central. No manual step required."
            fi
            echo
            echo '```kotlin'
            echo "implementation(\"io.github.$OWNER:roku-focus-list:$VERSION\")"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
