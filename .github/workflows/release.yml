name: Release

# Cut a new published version on demand:
#   gh workflow run release.yml -f version=2.0.1
# or from the Actions tab. Bump libraryVersion in gradle.properties first, in a normal PR —
# this workflow never pushes to master, it only creates a tag and a release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 2.0.1. Must already match libraryVersion in gradle.properties."
        required: true
        type: string
      dry_run:
        description: "Run every check but do not tag, release, or ask JitPack to build."
        type: boolean
        default: false
      prerelease:
        description: "Mark the GitHub release as a pre-release."
        type: boolean
        default: false

permissions:
  contents: write

# Two releases running at once would race on tags and on JitPack's build slot.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the version and the branch
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Bare numeric tags, matching the existing 1.0.0 tag. A leading v would change the
          # coordinate consumers write.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$VERSION' is not a bare semver version (expected e.g. 2.0.1, no leading v)."
            exit 1
          fi

          declared=$(grep -E '^libraryVersion=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "$declared" != "$VERSION" ]; then
            echo "::error::gradle.properties declares libraryVersion=$declared but you asked to release $VERSION."
            echo "::error::Bump libraryVersion in a PR first, then run this workflow against the merged commit."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists. Releases are immutable; pick a new version."
            exit 1
          fi

          case "$REF_NAME" in
            master|release/*) ;;
            *)
              if [ "$DRY_RUN" != "true" ]; then
                echo "::error::Refusing to release from '$REF_NAME'. Run this from master, a release/* branch, or with dry_run."
                exit 1
              fi
              echo "::warning::Dry run from '$REF_NAME'."
              ;;
          esac

          echo "Releasing $VERSION from $REF_NAME (dry_run=$DRY_RUN)."

      # JDK 17 on purpose: it is what jitpack.yml pins, so this run exercises the same toolchain
      # JitPack will use rather than a newer one that happens to work here.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build every target and run the shared tests
        run: |
          ./gradlew --no-daemon \
            :roku-focus-list:compileCommonMainKotlinMetadata \
            :roku-focus-list:compileAndroidMain \
            :roku-focus-list:compileKotlinDesktop \
            :roku-focus-list:compileKotlinIosArm64 \
            :roku-focus-list:compileKotlinIosX64 \
            :roku-focus-list:compileKotlinIosSimulatorArm64 \
            :roku-focus-list:desktopTest \
            :consumer-kmp:compileCommonMainKotlinMetadata \
            :consumer-kmp:compileAndroidMain \
            :app:assembleDebug \
            :app:assembleRelease

      - name: Publish locally and prove the coordinate is consumable
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :roku-focus-list:publishToMavenLocal
          # The standalone build resolves the real Maven coordinate from mavenLocal, in commonMain
          # and per target — the same path a consumer takes off JitPack.
          ./gradlew --no-daemon -p verification/published-consumer \
            verifyCommonMainConsumption printRokuFocusResolution

      - name: Check the published version is the one being released
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          pom="$HOME/.m2/repository/com/github/${{ github.repository_owner }}/roku-focus-list/$VERSION/roku-focus-list-$VERSION.pom"
          if [ ! -f "$pom" ]; then
            echo "::error::Expected $pom after publishToMavenLocal, but it is not there."
            echo "JitPack looks for exactly this path, so it would serve nothing for tag $VERSION."
            ls -R "$HOME/.m2/repository/com/github/${{ github.repository_owner }}" || true
            exit 1
          fi
          echo "Published $pom"

      # Written to a file rather than a step output: changelog entries are full of backticks, and
      # interpolating them into a shell command would run them.
      - name: Collect the changelog entry
        env:
          VERSION: ${{ inputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::warning::No '## [$VERSION]' section in CHANGELOG.md; releasing with a bare note."
            printf 'roku-focus-list %s\n' "$VERSION" > release-notes.md
          fi

          {
            printf '\n## Install\n\n'
            printf '```kotlin\n'
            printf 'implementation("com.github.%s:roku-focus-list:%s")\n' "$OWNER" "$VERSION"
            printf '```\n'
          } >> release-notes.md

          echo "--- release notes ---"
          cat release-notes.md

      - name: Tag and publish the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -euo pipefail
          git config user.name "$ACTOR"
          git config user.email "$ACTOR_ID+$ACTOR@users.noreply.github.com"
          git tag -a "$VERSION" -m "roku-focus-list $VERSION"
          git push origin "refs/tags/$VERSION"

          args=(--title "$VERSION" --notes-file release-notes.md --target "$GITHUB_SHA")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$VERSION" "${args[@]}"

      # JitPack builds a tag the first time somebody asks for it. Doing that here means the build
      # is already warm — and already known-good — before any consumer hits it.
      - name: Ask JitPack to build the tag
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          owner=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          base="https://jitpack.io/com/github/$owner/roku-focus-list/$VERSION"
          log="$base/build.log"

          echo "Build log: $log"
          ok=false
          for attempt in $(seq 1 30); do
            pom=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 \
              "$base/roku-focus-list-$VERSION.pom" || echo 000)
            # Gradle module metadata is what actually makes a KMP dependency resolve per target.
            mod=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 \
              "$base/roku-focus-list-$VERSION.module" || echo 000)
            echo "attempt $attempt: pom=$pom module=$mod"
            if [ "$pom" = "200" ] && [ "$mod" = "200" ]; then
              ok=true
              break
            fi
            sleep 30
          done

          if [ "$ok" != "true" ]; then
            echo "::error::JitPack has not served $VERSION yet. Tag and release exist; check $log"
            echo "::error::Re-run just this step by requesting the artifact again once the build finishes."
            exit 1
          fi
          echo "JitPack is serving $VERSION."

      - name: Summary
        if: always()
        env:
          VERSION: ${{ inputs.version }}
        run: |
          owner=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          {
            echo "## roku-focus-list $VERSION"
            echo
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "Dry run — nothing was tagged, released, or sent to JitPack."
            else
              echo "- Tag: \`$VERSION\` on \`$GITHUB_SHA\`"
              echo "- Release: https://github.com/${{ github.repository }}/releases/tag/$VERSION"
              echo "- JitPack: https://jitpack.io/#$owner/roku-focus-list/$VERSION"
              echo "- Build log: https://jitpack.io/com/github/$owner/roku-focus-list/$VERSION/build.log"
            fi
            echo
            echo '```kotlin'
            echo "implementation(\"com.github.$owner:roku-focus-list:$VERSION\")"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
