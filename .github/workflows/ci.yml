name: CI

# Every PR proves the library still works where it is developed (desktop JVM: unit tests plus
# headless Compose UI tests), still compiles for every published target, and still passes the
# shared test suite on a tvOS simulator. macOS runner because the Apple compiles need one anyway,
# so a single job covers all of it.
on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Desktop tests, Apple + wasm compiles, tvOS simulator tests
        run: |
          ./gradlew \
            :roku-focus-list:desktopTest \
            :roku-focus-list:compileKotlinIosSimulatorArm64 \
            :roku-focus-list:compileKotlinTvosSimulatorArm64 \
            :roku-focus-list:compileKotlinWasmJs \
            :roku-focus-list:tvosSimulatorArm64Test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: roku-focus-list/build/reports/tests/
